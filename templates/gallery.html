<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | IIC UIT Shimla</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: white;
            min-height: 100vh;
        }
        .slide-track {
    display: flex;
    transition: transform 0.6s ease-in-out;
    will-change: transform;
}

        .slider {
    position: relative;
    max-width: 900px;
    margin: auto;
    overflow: hidden;
    border-radius: 16px;
}

.slide-track {
    display: flex;
    transition: transform 0.5s ease-in-out;
}

.slide {
    min-width: 100%;
}

.slide img {
    width: 100%;
    height: 400px;
    object-fit: cover;
}

.caption {
    text-align: center;
    padding: 10px;
    background: rgba(5,10,30,0.9);
}
        .navbar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            background: rgba(2,6,23,.88);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            z-index: 1100;
            border: 1px solid rgba(56,189,248,.15);
        }
        .logo-group img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: contain;
            background: white;
            padding: 5px;
        }
        nav a {
            color: rgba(255,255,255,.85);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        nav a:hover { color: #38bdf8; }

        .hero {
            height: 40vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('../static/images/bg.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            color: #a855f7;
        }

        .container {
            padding: 80px 10%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            text-align: center;
            margin-bottom: 50px;
            background: linear-gradient(90deg, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }
        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .gallery-caption {
            padding: 15px;
            background: rgba(5,10,30,0.9);
            text-align: center;
            font-size: 15px;
        }
        .no-images {
            text-align: center;
            padding: 100px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo-group">
            <img src="../static/images/logo.jpg" alt="IIC Logo">
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/events">Events</a>
            <a href="/gallery">Gallery</a>
            <a href="/council">Council</a>
            <a href="/admin-login-page">Admin</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Photo Gallery</h1>
    </section>

    <div class="container">
        <h2 class="section-title">Moments from IIC Events</h2>
        <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery images loaded by JavaScript -->
        </div>
    </div>

    <div class="slider">
    <div class="slide-track" id="slideTrack">
        <!-- Images will load here -->
    </div>
</div>

    <script>
       let currentIndex = 0;

async function loadGallery() {
    try {
        const res = await fetch('/api/gallery');
        const images = await res.json();

        const track = document.getElementById('slideTrack');

        if (images.length === 0) {
            track.innerHTML = `<p style="text-align:center">No images found</p>`;
            return;
        }

        track.innerHTML = images.map(img => `
            <div class="slide">
                <img src="../static/uploads/${img.image}">
                <div class="caption">${img.title}</div>
            </div>
        `).join('');

        startSlider(images.length);

    } catch (err) {
        console.error(err);
    }
}

function startSlider(total) {
    setInterval(() => {
        currentIndex = (currentIndex + 1) % total;
        document.getElementById('slideTrack').style.transform =
            `translateX(-${currentIndex * 100}%)`;
    }, 3000); // change every 3 sec
}

window.onload = loadGallery;
    </script>
</body>
</html>
