<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | IIC UIT Shimla</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: white;
            min-height: 100vh;
        }
        .navbar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            background: rgba(2,6,23,.88);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            z-index: 1100;
            border: 1px solid rgba(56,189,248,.15);
        }
        .logo-group img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: contain;
            background: white;
            padding: 5px;
        }
        nav a {
            color: rgba(255,255,255,.85);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        nav a:hover { color: #38bdf8; }

        .hero {
            height: 40vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('../static/images/bg.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            color: #38bdf8;
        }

        .container {
            padding: 80px 10%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            text-align: center;
            margin-bottom: 50px;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
        .event-card {
            background: rgba(5,10,30,0.95);
            border: 1px solid rgba(56,189,248,0.25);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }
        .event-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(56,189,248,0.2);
        }
        .event-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .event-info {
            padding: 20px;
        }
        .event-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .event-date {
            color: #22c55e;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .event-desc {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            line-height: 1.6;
        }
        .no-events {
            text-align: center;
            padding: 80px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo-group">
            <img src="../static/images/logo.jpg" alt="IIC Logo">
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/events">Events</a>
            <a href="/gallery">Gallery</a>
            <a href="/council">Council</a>
            <a href="/admin-login-page">Admin</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Upcoming Events</h1>
    </section>

    <div class="container">
        <h2 class="section-title">All Events</h2>
        <div class="events-grid" id="eventsGrid">
            <!-- Events will be loaded here by JavaScript -->
        </div>
    </div>

    <script>
        async function loadEvents() {
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                const container = document.getElementById('eventsGrid');

                if (events.length === 0) {
                    container.innerHTML = `<div class="no-events">No events available at the moment.</div>`;
                    return;
                }

                container.innerHTML = events.map(event => `
                    <div class="event-card">
                        ${event.image ? 
                            `<img src="../static/uploads/${event.image}" alt="${event.event_name}">` : 
                            `<div style="height:220px;background:#1e2937;display:flex;align-items:center;justify-content:center;color:#666;">No Image</div>`
                        }
                        <div class="event-info">
                            <h3>${event.event_name}</h3>
                            <div class="event-date">${event.date}</div>
                            <div class="event-desc">${event.description || 'No description available.'}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('eventsGrid').innerHTML = 
                    `<div class="no-events">Failed to load events. Please try again later.</div>`;
            }
        }

        // Load events when page loads
        window.onload = loadEvents;
    </script>
</body>
</html>
