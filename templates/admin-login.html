<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | IIC UIT Shimla</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            background: rgba(5, 10, 30, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            width: 380px;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            padding: 8px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(56,189,248,0.08);
            border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #38bdf8, #22c55e);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56,189,248,0.4);
        }

        .error {
            color: #f87171;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .back-link {
            margin-top: 25px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="../static/images/logo.jpg" alt="IIC Logo" class="logo">
        
        <h2>Admin Login</h2>
        <p>Institution's Innovation Council</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="error" id="errorMsg"></div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            errorMsg.style.display = 'none';

            if (!username || !password) {
                errorMsg.textContent = "Please enter username and password";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user: username,
                        pass: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect || '/admin/dashboard';
                } else {
                    errorMsg.textContent = data.message || "Invalid credentials";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Server error. Please try again.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
